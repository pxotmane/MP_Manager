{% load django_bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>E-mail envoyé - MP Manager</title>
    {% bootstrap_css %}
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4 text-center">
                <img src="{% static 'IMAGE/fin_logo.png' %}" alt="Logo" class="img-fluid mb-4" style="max-height: 100px;">
                <div class="card rounded-3">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3 fw-bold text-mp-blue">Vérifiez votre boîte mail</h5>
                        <p class="text-muted small mb-4">
                            Nous vous avons envoyé des instructions par e-mail pour réinitialiser votre mot de passe, si un compte existe avec l'adresse saisie.
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">Retour à l'accueil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
