{% load django_bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe modifié</title>
    {% bootstrap_css %}
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4 text-center">
                <img src="{% static 'IMAGE/fin_logo.png' %}" alt="Logo" class="img-fluid mb-4" style="max-height: 100px;">
                <div class="card rounded-3">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3 fw-bold text-mp-blue">Mot de passe modifié !</h5>
                        <p class="text-muted small mb-4">Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
                        <a href="{% url 'login' %}" class="btn btn-matte-primary w-100">Se connecter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
